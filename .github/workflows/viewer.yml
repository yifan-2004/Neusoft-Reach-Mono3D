name: Prediction viewer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python tools/render_predictions.py --predictions examples/synthetic_predictions.txt --calibration examples/synthetic_calib.txt --synthetic --output /tmp/geometry-demo.html
